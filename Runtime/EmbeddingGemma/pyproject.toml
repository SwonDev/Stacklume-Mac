[project]
name = "egemma"
version = "0.1.0"
description = "Servicio local de EmbeddingGemma 2: API HTTP compatible con OpenAI, índice semántico multimodal, MCP y CLI"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mlx==0.32.3; sys_platform == 'darwin'",
  "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@fec3f50379bb2cb0760ef3c8a68ebce9585e4d97 ; sys_platform == 'darwin'",
  "torch==2.14.1; sys_platform != 'darwin'",
  "torchvision==0.29.1; sys_platform != 'darwin'",
  "transformers==5.19.0",
  "sentence-transformers==6.1.0; sys_platform != 'darwin'",
  "pillow>=12",
  "av>=19",
  "numpy>=2.3",
  "fastapi>=0.142",
  "uvicorn>=0.54",
  "httpx>=0.28",
  "mcp>=2.3",
  "sqlite-vec>=0.1.9",
  "pypdfium2>=5.14",
]

[project.scripts]
egemma = "egemma.cli:main"
egemma-mcp = "egemma.mcp_server:main"

[project.gui-scripts]
egemma-server = "egemma.cli:serve_gui"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["egemma"]

[tool.uv]
required-version = ">=0.13.0"
# Igual que pnpm (minimum-release-age=1440): nada publicado hace menos de 24 h,
# salvo transformers 5.19.0, la primera versión que trae EmbeddingGemma 2.
exclude-newer = "PT24H"
constraint-dependencies = ["huggingface-hub==1.33.0"]
exclude-newer-package = { transformers = "2026-10-07T07:00:00Z" }

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: pruebas que cargan el modelo real (lentas, necesitan GPU o paciencia)"]

[tool.hatch.metadata]
allow-direct-references = true
